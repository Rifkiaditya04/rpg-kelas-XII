<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World 1 — Mission System Prototype v1</title><style>.hidden{display:none}iframe{width:100%;height:720px;border:0}</style></head><body><main><section id="brief"><h1>📄 The Application Review</h1><p>Kamu mendapat misi untuk memeriksa sebuah dokumen lamaran kerja sebelum dikirim.</p><button id="start">Mulai Mission</button></section><section id="teach" class="hidden"><h2>Guru Pembimbing</h2><p>Sebelum lamaran dikirim, kita perlu memeriksa relevansi, menemukan masalah, dan melakukan pemeriksaan secara sistematis.</p><button id="toChallenge">Saya siap melakukan challenge</button></section><section id="challenge" class="hidden"><h2>Buktikan pemahamanmu</h2><iframe id="renderer" title="Question Renderer"></iframe></section><section id="training" class="hidden"><h2>Belum mencapai 70%</h2><p id="trainingText"></p><button id="retry">Coba Lagi</button></section><section id="result" class="hidden"></section></main><script>const $=id=>document.getElementById(id);const RENDERER='index.html?dataset=../../phase-3/world-1-mission-system-prototype-v1-dataset.json&mission=BI12-W01-M01';const PASS=70;let completionAwarded=false;function show(id){['brief','teach','challenge','training','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}$('start').onclick=()=>show('teach');$('toChallenge').onclick=()=>{show('challenge');$('renderer').src=RENDERER;};$('retry').onclick=()=>{show('challenge');$('renderer').src=RENDERER+'&retry='+Date.now();};window.addEventListener('message',event=>{const d=event.data||{};if(d.type!=='MISSION_RENDERER_RESULT'||d.mission_id!=='BI12-W01-M01')return;if(window.parent!==window)window.parent.postMessage(d,'*');const accuracy=Number(d.accuracy)||0;if(accuracy>=PASS){if(!completionAwarded)completionAwarded=true;show('result');$('result').innerHTML=`<h1>🏆 Mission Complete</h1><p>${d.correct}/${d.total} Benar</p><p>${d.xp+100} XP</p><p>${accuracy}% Akurasi</p><button onclick="location.reload()">Main Lagi</button>`;}else{show('training');$('trainingText').textContent=`Hasilmu ${accuracy}%. Misi membutuhkan minimal ${PASS}% untuk dinyatakan selesai.`;}});</script></body></html>
