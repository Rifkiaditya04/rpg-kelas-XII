<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World 1 — Integrated QA / Regression Gate</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f5f5f5;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}.status{font-weight:700}.pass{color:#137333}.fail{color:#b3261e}.pending{color:#8a5a00}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}iframe{width:100%;height:720px;border:1px solid #ccc;border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.item{padding:10px;border:1px solid #ddd;border-radius:8px}.small{font-size:.9rem;color:#666}</style></head><body><section class="card"><h1>World 1 — Integrated QA / Regression Gate</h1><p>QA-only runner for the complete approved Chapter I A–F pool. It drives the actual question renderer against the two approved resolved QA datasets; it is not student-facing.</p><button id="run">Run integrated regression</button><p id="overall" class="status pending">Belum dijalankan.</p></section><section class="card"><h2>Gate checks</h2><div id="checks" class="grid"></div></section><section class="card"><h2>Renderer under test</h2><iframe id="game" title="Actual renderer under test"></iframe></section><script>
const DATASETS=[{lane:'A–C',url:'../../phase-3/world-1-question-batch-a-c-v1.1-regression-dataset.json',expected:9},{lane:'D–F',url:'../../phase-3/world-1-question-batch-d-f-v1.1-regression-dataset.json',expected:9}];const checksEl=document.getElementById('checks'),overallEl=document.getElementById('overall'),frame=document.getElementById('game'),runBtn=document.getElementById('run');const wait=ms=>new Promise(r=>setTimeout(r,ms));async function waitFor(fn,timeout=10000){const s=Date.now();while(Date.now()-s<timeout){try{if(fn())return;}catch(e){}await wait(100)}throw new Error('timeout')}function card(id,label,state,detail=''){const el=document.createElement('div');el.className='item';el.innerHTML=`<strong>${id}</strong><br>${label}<br><span class="status ${state==='PASS'?'pass':state==='FAIL'?'fail':'pending'}">${state}</span><div class="small">${detail}</div>`;checksEl.appendChild(el)}async function load(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}: ${url}`);return r.json()}function answers(q){return Array.isArray(q.answer)?[...q.answer]:[q.answer]}function buttons(){return [...frame.contentDocument.querySelectorAll('.option')]}function choose(q){for(const a of answers(q)){const b=buttons().find(x=>x.dataset.answer===a);if(!b)throw Error(`${q.id}: answer option missing`);b.click()}}async function navigateToRenderer(url,lane){const token=`${Date.now()}-${lane}`;const nextSrc=`index.html?dataset=${encodeURIComponent(url)}&qa=1&regression=1&v=5&run=${token}`;await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(new Error(`${lane}: renderer navigation timeout`)),10000);frame.onload=()=>{clearTimeout(timeout);resolve()};frame.src=nextSrc});await waitFor(()=>frame.contentDocument?.querySelector('#questionArea'));await waitFor(()=>{const e=frame.contentDocument.querySelector('#loadError');if(e&&!e.classList.contains('hidden'))throw Error(e.textContent.trim());return true})}async function play(dataset,url,lane){await navigateToRenderer(url,lane);const expectedTexts=new Set(dataset.items.map(q=>q.question));await waitFor(()=>{const text=frame.contentDocument.querySelector('.question')?.textContent;return text&&expectedTexts.has(text)});const seen=[];for(let i=0;i<dataset.items.length;i++){await waitFor(()=>{const text=frame.contentDocument.querySelector('.question')?.textContent;return text&&expectedTexts.has(text)});const text=frame.contentDocument.querySelector('.question').textContent;const q=dataset.items.find(x=>x.question===text);if(!q)throw Error(`Question ${i+1} tidak cocok dengan dataset ${lane}`);if(seen.includes(q.id))throw Error(`${q.id}: duplicate display`);seen.push(q.id);choose(q);const submit=frame.contentDocument.querySelector('#submit');if(!submit||submit.disabled)throw Error(`${q.id}: submit disabled`);submit.click();await waitFor(()=>{const f=frame.contentDocument.querySelector('#feedback');return f&&!f.classList.contains('hidden')});const fb=frame.contentDocument.querySelector('#feedback').textContent;if(!fb.includes('Jawaban benar'))throw Error(`${q.id}: canonical answer rejected`);if(q.question_type==='multi_select'){const hint=frame.contentDocument.querySelector('.interaction-hint')?.textContent||'';if(!hint.includes('Pilih semua')||!hint.includes(`Pilih ${q.answer.length} jawaban`))throw Error(`${q.id}: multi-select instruction mismatch`)}const next=frame.contentDocument.querySelector('#next');if(!next)throw Error(`${q.id}: next missing`);next.click();if(i<dataset.items.length-1)await waitFor(()=>{const text=frame.contentDocument.querySelector('.question')?.textContent;return text&&expectedTexts.has(text)});else await waitFor(()=>{const r=frame.contentDocument.querySelector('#result');return r&&!r.classList.contains('hidden')})}const result=frame.contentDocument.querySelector('#result');if(!result.textContent.includes(`${dataset.items.length}/${dataset.items.length}`))throw Error(`${dataset.items.length}-item result mismatch`);if(!result.textContent.includes(String(dataset.items.length*100)))throw Error(`Per-dataset XP mismatch: expected ${dataset.items.length*100}`);return seen}async function run(){runBtn.disabled=true;checksEl.innerHTML='';overallEl.textContent='Running…';overallEl.className='status pending';try{const all=[];const loaded={};for(const d of DATASETS){const ds=await load(d.url);loaded[d.lane]=ds;if(!Array.isArray(ds.items)||ds.items.length!==d.expected)throw Error(`${d.lane}: expected ${d.expected} items`);const ids=ds.items.map(q=>q.id);if(new Set(ids).size!==d.expected)throw Error(`${d.lane}: duplicate IDs`);if(ds.items.some(q=>!q.source?.student_book?.pages||!q.source?.student_book?.section||!q.source?.teacher_guide?.pages||!q.source?.teacher_guide?.section))throw Error(`${d.lane}: provenance incomplete`);all.push(...ds.items)}if(all.length!==18)throw Error(`Integrated count ${all.length}, expected 18`);if(new Set(all.map(q=>q.id)).size!==18)throw Error('Integrated IDs are not unique');card('DATA','A–F resolved QA datasets dapat dimuat','PASS','9 A–C + 9 D–F');card('SCHEMA','18 item + ID unik','PASS','AC-001 … AC-009 + DF-001 … DF-009');const supported=['mcq','multi_select','document_inspection','dialogue_analysis','ordering','evidence_matching'];if(all.some(q=>!supported.includes(q.question_type)))throw Error('Unsupported question_type');card('TYPES','Semua question_type dikenali renderer','PASS',[...new Set(all.map(q=>q.question_type))].join(', '));card('PROVENANCE','Student Book + Teacher Guide provenance lengkap','PASS','18/18');const ac=await play(loaded['A–C'],DATASETS[0].url,'A-C');card('LOAD/AC','Renderer aktual memuat dan memainkan A–C','PASS','9/9 · 900 XP');const df=await play(loaded['D–F'],DATASETS[1].url,'D-F');card('LOAD/DF','Renderer aktual memuat dan memainkan D–F','PASS','9/9 · 900 XP');const coverage=[...ac,...df];if(new Set(coverage).size!==18)throw Error('Coverage mismatch');card('ANSWER','18 canonical answer keys diterima','PASS','18/18');card('SCORE','Per-batch XP konsisten','PASS','A–C 900 XP + D–F 900 XP');card('COVERAGE','Semua 18 approved IDs dimainkan','PASS','18/18 across lanes A–F');card('FEEDBACK','Feedback + explanation tampil','PASS','Diverifikasi pada setiap submission');card('INTEGRATION','Approved pools tetap additive/versioned','PASS','Golden Dataset v1 untouched; A–C/D–F tested as separate approved pools');overallEl.textContent='PASS — World 1 Integrated QA / Regression Gate';overallEl.className='status pass'}catch(e){card('INTEGRATED','Integrated regression','FAIL',e.message);overallEl.textContent='FAIL — lihat detail check terakhir';overallEl.className='status fail'}finally{runBtn.disabled=false}}runBtn.onclick=run;</script></body></html>
