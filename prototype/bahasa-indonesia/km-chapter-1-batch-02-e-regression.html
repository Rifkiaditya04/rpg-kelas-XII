<!doctype html><html lang="id"><head><meta charset="utf-8"><title>KM Chapter 1 — Batch 02 E1-E3 Regression</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px}button{padding:10px 16px;font-weight:700}.check{margin:10px 0;padding:12px;border:1px solid #ddd;border-radius:8px}.pass{border-color:#2a8}.fail{border-color:#c33}.meta{color:#555}</style></head><body><h1>KM Chapter 1 — Original Batch 02 E1-E3 Regression</h1><p class="meta">QA-only harness. Does not modify Golden Dataset.</p><button id="run">Run E1-E3 regression</button><div id="status"></div><div id="checks"></div><iframe id="app" title="Actual renderer" style="width:100%;min-height:700px;border:1px solid #ddd;margin-top:20px"></iframe><script>
const datasetUrl='../../phase-3/world-1-km-chapter-1-original-content-batch-02-e1-e3-draft-v1.1.json';
const expected=['KM02-E1','KM02-E2','KM02-E3'];
const checks=[];function add(name,state,detail=''){checks.push({name,state,detail});renderChecks()}function renderChecks(){document.getElementById('checks').innerHTML=checks.map(c=>`<div class="check ${c.state.toLowerCase()}"><b>${c.name}</b><br>${c.state}<br><span>${c.detail}</span></div>`).join('')}
async function run(){checks.length=0;renderChecks();document.getElementById('status').textContent='Running…';try{const r=await fetch(datasetUrl,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const items=data.items||data.questions||[];add('DATA','PASS',items.length+' items');const ids=items.map(x=>x.id);const unique=new Set(ids).size===ids.length&&expected.every(id=>ids.includes(id));add('IDS',unique?'PASS':'FAIL',ids.join(', '));const contract=items.length===3&&items.every(x=>x.question_type==='mcq'&&Array.isArray(x.options)&&typeof x.answer==='string'&&x.options.includes(x.answer));add('CONTRACT',contract?'PASS':'FAIL','MCQ answer shape + options');if(!contract)throw Error('Contract failed');const frame=document.getElementById('app');frame.src='km-batch-01-runtime.html?qa='+Date.now();await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('QA runtime load timeout')),8000);frame.onload=()=>{clearTimeout(t);resolve()}});add('LOAD','PASS','Actual renderer QA entrypoint loaded');document.getElementById('status').textContent='Loaded. Browser interaction must be exercised manually.';add('RUNTIME','PENDING','Select E1, E2, E3 and submit each in the actual renderer; record canonical answers and feedback.');}catch(e){add('RUNTIME','FAIL',e.message);document.getElementById('status').textContent='FAIL — lihat detail'}}document.getElementById('run').onclick=run;</script></body></html>
