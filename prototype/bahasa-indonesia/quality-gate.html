<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quality Gate — Bahasa Indonesia</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card"><h1>Golden Dataset v1 — Quality Gate</h1><div id="out">Memeriksa...</div></section></main><script>
const DATA='../../knowledge-base/bahasa-indonesia/v1/golden-dataset-v1.json';const TYPES=new Set(['mcq','multi_select','ordering','document_inspection','evidence_matching','dialogue_analysis']);
(async()=>{const out=document.getElementById('out');try{const r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const e=[];const ids=new Set();for(const q of d.items||[]){if(ids.has(q.id))e.push(`ID duplikat: ${q.id}`);ids.add(q.id);for(const f of ['id','chapter_id','topic_id','skill','cognitive_level','difficulty','question_type','question','answer','explanation','source','provenance','mode','game_mechanic'])if(q[f]===undefined||q[f]===null||q[f]==='')e.push(`${q.id}: ${f} kosong`);if(!TYPES.has(q.question_type))e.push(`${q.id}: type ${q.question_type} tidak didukung`);if(!q.source?.student_book?.pages||!q.source?.student_book?.section)e.push(`${q.id}: student-book provenance tidak lengkap`);if(!q.source?.teacher_guide?.pages||!q.source?.teacher_guide?.section)e.push(`${q.id}: teacher-guide provenance tidak lengkap`);if(!Array.isArray(q.options)||q.options.length<2)e.push(`${q.id}: options tidak valid`);if(q.question_type==='multi_select'&&!Array.isArray(q.answer))e.push(`${q.id}: multi_select answer harus array`);if(q.question_type!=='multi_select'&&Array.isArray(q.answer))e.push(`${q.id}: single answer harus scalar`);}out.innerHTML=e.length?`<h2>❌ FAIL</h2><ul>${e.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<h2>✅ PASS</h2><p>${d.items.length} item tervalidasi secara struktural.</p><ul><li>Required fields: PASS</li><li>Unique IDs: PASS</li><li>Supported interaction types: PASS</li><li>Student-book provenance: PASS</li><li>Teacher-guide provenance: PASS</li><li>Answer shape: PASS</li><li>Renderer dispatch contract: PASS</li><li>Question order randomization: ENABLED</li><li>Option order randomization: ENABLED</li></ul><p class="small">Validasi akademik tetap ditopang oleh cross-check Buku Siswa dan Panduan Guru yang dicatat pada dataset.</p>`;}catch(err){out.innerHTML=`<h2>❌ FAIL</h2><p>${err.message}</p><p class="small">Jalankan melalui web server/hosting, bukan file://.</p>`;}})();
</script></body></html>
