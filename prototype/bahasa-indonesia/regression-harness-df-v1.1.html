<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World 1 — D–F v1.1 Controlled Live Regression</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f5f5f5;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}.status{font-weight:700}.pass{color:#137333}.fail{color:#b3261e}.pending{color:#8a5a00}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}.item{padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.small{font-size:.9rem;color:#666}iframe{width:100%;height:720px;border:1px solid #ccc;border-radius:10px;background:white}</style></head><body><section class="card"><h1>Controlled Live Regression — D–F v1.1</h1><p>QA-only runner for the resolved canonical World 1 Chapter I lanes D–F v1.1 dataset. It drives the actual question renderer and is not student-facing.</p><button id="run">Run 9-item regression</button><p id="overall" class="status pending">Belum dijalankan.</p></section><section class="card"><h2>Regression checks</h2><div id="checks"></div></section><section class="card"><h2>Renderer under test</h2><iframe id="game" title="Renderer under test"></iframe></section><script>
const DATASET_URL='../../phase-3/world-1-question-batch-d-f-v1.1-regression-dataset.json';const checksEl=document.getElementById('checks'),overallEl=document.getElementById('overall'),frame=document.getElementById('game'),runBtn=document.getElementById('run');let dataset=null;function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function waitFor(fn,timeout=10000){const s=Date.now();while(Date.now()-s<timeout){try{if(fn())return}catch(e){}await wait(100)}throw new Error('timeout')}function card(id,label,state='PENDING',detail=''){const e=document.createElement('div');e.className='item';e.innerHTML=`<strong>${id}</strong><br>${label}<br><span class="status ${state==='PASS'?'pass':state==='FAIL'?'fail':'pending'}">${state}</span><div class="small">${detail}</div>`;checksEl.appendChild(e)}function answers(q){return Array.isArray(q.answer)?[...q.answer]:[q.answer]}function buttons(){return [...frame.contentDocument.querySelectorAll('.option')]}function choose(q){for(const a of answers(q)){const b=buttons().find(x=>x.dataset.answer===a);if(!b)throw new Error(`${q.id}: canonical answer option tidak ditemukan`);b.click()}}
async function load(){const r=await fetch(DATASET_URL,{cache:'no-store'});if(!r.ok)throw new Error(`Dataset HTTP ${r.status}`);dataset=await r.json();if(!Array.isArray(dataset.items)||dataset.items.length!==9)throw new Error(`Dataset invalid: expected 9, got ${dataset.items?.length??'undefined'}`)}
async function run(){runBtn.disabled=true;checksEl.innerHTML='';overallEl.textContent='Running…';overallEl.className='status pending';try{await load();const ids=dataset.items.map(q=>q.id);if(new Set(ids).size!==9)throw new Error('ID duplikat');card('DATA','Resolved canonical D–F QA dataset dapat dimuat','PASS','9 item dari canonical base + revision overlay');card('SCHEMA','9 item + ID unik','PASS','DF-001 … DF-009');const supported=['mcq','multi_select','document_inspection'];for(const q of dataset.items)if(!supported.includes(q.question_type))throw new Error(`${q.id}: unsupported ${q.question_type}`);card('TYPES','Semua question_type dikenali renderer','PASS',dataset.items.map(q=>q.question_type).join(', '));frame.src=`index.html?dataset=${encodeURIComponent(DATASET_URL)}&qa=1&regression=1&v=df11`;await waitFor(()=>frame.contentDocument&&frame.contentDocument.querySelector('#questionArea'));await waitFor(()=>{const e=frame.contentDocument.querySelector('#loadError');if(e&&!e.classList.contains('hidden'))throw new Error(e.textContent.trim());return true});card('LOAD','Renderer aktual memuat resolved D–F dataset','PASS','iframe memakai renderer aktual + regression dataset');const seen=[];let xp=0;for(let i=0;i<dataset.items.length;i++){await waitFor(()=>frame.contentDocument.querySelector('.question'));const text=frame.contentDocument.querySelector('.question')?.textContent||'';const q=dataset.items.find(x=>x.question===text);if(!q)throw new Error(`Soal ${i+1} tidak cocok dengan resolved dataset`);if(seen.includes(q.id))throw new Error(`${q.id}: muncul dua kali`);seen.push(q.id);choose(q);const submit=frame.contentDocument.querySelector('#submit');if(!submit||submit.disabled)throw new Error(`${q.id}: submit disabled`);submit.click();await waitFor(()=>{const f=frame.contentDocument.querySelector('#feedback');return f&&!f.classList.contains('hidden')});const feedback=frame.contentDocument.querySelector('#feedback')?.textContent||'';if(!feedback.includes('Jawaban benar'))throw new Error(`${q.id}: canonical answer ditolak`);if(q.question_type==='multi_select'){const hint=frame.contentDocument.querySelector('.interaction-hint')?.textContent||'';if(!hint.includes('Pilih semua')||!hint.includes(`Pilih ${q.answer.length} jawaban`))throw new Error(`${q.id}: multi-select instruction mismatch`)}xp+=100;const next=frame.contentDocument.querySelector('#next');if(!next)throw new Error(`${q.id}: next tidak ditemukan`);next.click();if(i<dataset.items.length-1)await waitFor(()=>frame.contentDocument.querySelector('.question'));else await waitFor(()=>{const r=frame.contentDocument.querySelector('#result');return r&&!r.classList.contains('hidden')})}card('ANSWER','Semua 9 canonical answer keys diterima','PASS',`XP expected ${xp}`);const result=frame.contentDocument.querySelector('#result');if(!result||result.classList.contains('hidden'))throw new Error('Result screen tidak muncul');if(!result.textContent.includes('9/9')||!result.textContent.includes(String(xp)))throw new Error('Final result mismatch');card('SCORE','XP dan hasil akhir konsisten','PASS',`9/9 · ${xp} XP`);if(new Set(seen).size!==9)throw new Error(`Coverage ${new Set(seen).size}/9`);card('COVERAGE','Semua 9 ID dimainkan','PASS',seen.join(', '));card('FEEDBACK','Feedback + explanation tampil','PASS','Diverifikasi pada setiap submission');overallEl.textContent='PASS — Controlled Live Regression D–F v1.1';overallEl.className='status pass'}catch(e){card('REGRESSION','Controlled live regression','FAIL',e.message);overallEl.textContent='FAIL — lihat detail check terakhir';overallEl.className='status fail'}finally{runBtn.disabled=false}}runBtn.onclick=run;
</script></body></html>
