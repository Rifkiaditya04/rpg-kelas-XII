<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM Chapter 1 — Batch 01 Regression</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f5f5f5;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}.pass{color:#137333}.fail{color:#b3261e}.pending{color:#8a5a00}.status{font-weight:700}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}iframe{width:100%;height:720px;border:1px solid #ccc;border-radius:10px}.item{padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}</style></head>
<body><section class="card"><h1>KM Chapter 1 — Original Batch 01 Regression</h1><p>QA-only harness. Does not modify Golden Dataset.</p><button id="run">Run 6-item regression</button><p id="overall" class="status pending">Belum dijalankan.</p></section><section class="card"><h2>Checks</h2><div id="checks"></div></section><section class="card"><h2>Renderer under test</h2><iframe id="game" title="Renderer under test"></iframe></section>
<script>
const DATASET_URL='../../phase-3/world-1-km-chapter-1-original-content-batch-01-schema-v1.1-draft.json';
const checks=document.getElementById('checks'),overall=document.getElementById('overall'),frame=document.getElementById('game'),runBtn=document.getElementById('run');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,timeout=10000){const s=Date.now();while(Date.now()-s<timeout){try{const value=fn();if(value)return value;}catch(e){throw e;}await wait(100)}throw Error('timeout')}
function card(id,label,state,detail=''){const e=document.createElement('div');e.className='item';e.innerHTML=`<strong>${id}</strong><br>${label}<br><span class="status ${state==='PASS'?'pass':state==='FAIL'?'fail':'pending'}">${state}</span><br><small>${detail}</small>`;checks.appendChild(e)}
async function waitForRendererState(){return await waitFor(()=>{const doc=frame.contentDocument;if(!doc)return null;const error=doc.querySelector('#loadError');if(error&&!error.classList.contains('hidden'))throw Error(error.textContent.trim()||'Renderer load error');const question=doc.querySelector('.question');if(question)return question;return null;});}
async function run(){runBtn.disabled=true;checks.innerHTML='';overall.textContent='Running…';overall.className='status pending';try{
 const r=await fetch(DATASET_URL,{cache:'no-store'});if(!r.ok)throw Error(`Dataset HTTP ${r.status}`);const d=await r.json();const items=Array.isArray(d.items)?d.items:(Array.isArray(d.questions)?d.questions:null);if(!items||items.length!==6)throw Error(`Expected 6 questions/items, got ${items?.length??'undefined'}`);const ids=items.map(q=>q.id);if(new Set(ids).size!==6)throw Error('Duplicate ID');card('DATA','Batch 01 loads','PASS','6 items');card('IDS','Unique IDs','PASS',ids.join(', '));
 for(const q of items){if(q.question_type!=='mcq')throw Error(`${q.id}: expected mcq`);if(!Array.isArray(q.options)||q.options.length<2)throw Error(`${q.id}: invalid options`);if(!q.options.includes(q.answer))throw Error(`${q.id}: answer not found in options`)}card('CONTRACT','MCQ answer shape + options','PASS','All six items');
 frame.src=`index.html?dataset=${encodeURIComponent(DATASET_URL)}&qa=1&regression=1&v=km01r2`;
 await waitForRendererState();card('LOAD','Renderer loads draft dataset','PASS','Actual renderer via index.html');
 const seen=[];for(let i=0;i<items.length;i++){const questionEl=await waitForRendererState();const text=questionEl.textContent||'';const q=items.find(x=>x.question===text);if(!q)throw Error(`Displayed question ${i+1} not found in dataset`);seen.push(q.id);const buttons=[...frame.contentDocument.querySelectorAll('.option')];const b=buttons.find(x=>x.dataset.answer===q.answer);if(!b)throw Error(`${q.id}: canonical answer button missing`);b.click();const submit=frame.contentDocument.querySelector('#submit');if(!submit||submit.disabled)throw Error(`${q.id}: submit disabled`);submit.click();await waitFor(()=>{const f=frame.contentDocument.querySelector('#feedback');return f&&!f.classList.contains('hidden')});const feedback=frame.contentDocument.querySelector('#feedback')?.textContent||'';if(!feedback.includes('Jawaban benar'))throw Error(`${q.id}: answer rejected`);const next=frame.contentDocument.querySelector('#next');if(!next)throw Error(`${q.id}: next missing`);next.click();if(i<items.length-1)await waitForRendererState();}
 card('ANSWERS','All six canonical answers accepted','PASS',seen.join(', '));overall.textContent='PASS — Batch 01 renderer regression';overall.className='status pass';
}catch(e){card('RUNTIME','Actual browser regression','FAIL',e.message);overall.textContent='FAIL — lihat detail';overall.className='status fail'}finally{runBtn.disabled=false}}
runBtn.onclick=run;
</script></body></html>
