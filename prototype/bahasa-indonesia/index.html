<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KELAS 12 — The Final Mission</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000012}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.badge{background:#e9eefb;border-radius:999px;padding:7px 11px;font-size:13px}.bar{height:9px;background:#e7eaf0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:#4263eb;transition:.25s}.options{display:grid;gap:10px;margin-top:18px}.option{border:1px solid #d9deea;background:#fff;border-radius:12px;padding:13px;text-align:left;cursor:pointer;font:inherit}.option:hover{background:#f5f7fb}.option.selected{border-color:#4263eb;background:#eef2ff}.option.correct{border-color:#2f9e44;background:#ebfbee}.option.wrong{border-color:#e03131;background:#fff5f5}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.button{border:0;border-radius:11px;padding:11px 16px;background:#172033;color:#fff;cursor:pointer;font-weight:700}.button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;padding:14px;border-radius:12px;background:#f6f7f9}.small{font-size:13px;color:#687083}.hidden{display:none}.result{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:14px;background:#f4f6fa;border-radius:12px}.world{margin:0 0 5px}.question{font-size:21px;line-height:1.45;margin:14px 0}.footer{margin-top:16px;text-align:center;font-size:12px;color:#737b8c}@media(max-width:600px){.stats{grid-template-columns:1fr}.question{font-size:18px}}
</style></head>
<body><main class="app"><section id="game" class="card">
<div class="top"><div><p class="world" id="world"></p><div class="small" id="counter"></div></div><div class="badge" id="score">XP 0</div></div>
<div class="bar"><i id="progress"></i></div>
<div id="questionArea"></div>
</section><section id="result" class="card hidden result"></section><p class="footer">KELAS 12 — THE FINAL MISSION · Micro-prototype · Bahasa Indonesia</p></main>
<script>
const qs=[
{id:'BI12-GOLD-001',w:'🌐 Career Mission',q:'Dalam konteks surat lamaran kerja, informasi pada surat harus disusun terutama untuk menunjukkan bahwa pelamar memenuhi kebutuhan posisi yang dilamar. Prinsip apa yang paling tepat?',o:['Relevansi informasi dengan posisi yang dilamar','Penggunaan sebanyak mungkin informasi pribadi','Penggunaan bahasa yang sangat panjang','Pencantuman seluruh pengalaman tanpa seleksi'],a:[0],e:'Informasi surat lamaran perlu relevan dengan posisi agar hubungan antara kualifikasi pelamar dan kebutuhan pekerjaan terlihat jelas.',m:'Document Inspection'},
{id:'BI12-GOLD-002',w:'🌐 Career Mission',q:'Sebuah surat lamaran mencantumkan pengalaman yang sangat banyak, tetapi hampir seluruhnya tidak berhubungan dengan posisi yang dituju. Apa evaluasi yang paling tepat?',o:['Surat perlu diseleksi agar informasi yang ditonjolkan lebih relevan dengan posisi','Surat sudah sempurna karena semakin banyak pengalaman selalu semakin baik','Semua pengalaman harus dihapus','Surat harus dibuat lebih panjang'],a:[0],e:'Kualitas surat tidak ditentukan oleh banyaknya informasi, tetapi oleh relevansi dan kemampuannya mendukung tujuan lamaran.',m:'Error Hunt'},
{id:'BI12-GOLD-003',w:'🎬 Film Detective',q:'Ketika sebuah cerpen diadaptasi menjadi film, perubahan adegan atau urutan peristiwa perlu dianalisis dengan membandingkan fungsi bagian tersebut dalam kedua karya. Pendekatan apa yang paling tepat?',o:['Membandingkan unsur cerita dan perubahan penyajiannya pada kedua medium','Menilai film hanya dari kualitas gambarnya','Menganggap semua perubahan sebagai kesalahan','Mengabaikan cerpen setelah menonton film'],a:[0],e:'Analisis ekranisasi membutuhkan perbandingan karya sumber dan hasil adaptasi, termasuk perubahan unsur cerita dan cara penyajiannya.',m:'Adaptation Compare'},
{id:'BI12-GOLD-004',w:'🎬 Film Detective',q:'Dalam sebuah film pendek terdapat simbol visual yang muncul berulang kali. Sebelum menyimpulkan maknanya, tindakan analisis yang paling kuat adalah...',o:['Menghubungkan simbol dengan konteks cerita, karakter, konflik, dan pesan yang dibangun','Langsung menetapkan makna berdasarkan pengalaman pribadi','Menganggap simbol tidak memiliki fungsi','Hanya menghitung berapa kali simbol muncul'],a:[0],e:'Makna simbol harus ditafsirkan berdasarkan konteks karya, bukan hanya berdasarkan asosiasi pribadi atau frekuensi kemunculannya.',m:'Symbol Decode'},
{id:'BI12-GOLD-005',w:'🎭 Drama Stage',q:'Dalam drama, dialog tokoh dan petunjuk laku sama-sama dapat membantu pembaca memahami tindakan dan konflik. Jika petunjuk laku menunjukkan tokoh mengepalkan tangan sebelum berbicara, unsur tersebut terutama berfungsi untuk...',o:['Memberikan petunjuk tindakan atau ekspresi yang mendukung pemahaman karakter dan situasi','Menggantikan seluruh dialog','Menentukan judul drama','Menjelaskan biodata penulis'],a:[0],e:'Petunjuk laku membantu menggambarkan tindakan, ekspresi, atau cara adegan dimainkan sehingga konteks karakter dan konflik lebih jelas.',m:'Stage Direction'},
{id:'BI12-GOLD-006',w:'🎭 Drama Stage',q:'Dua tokoh memiliki tujuan yang bertentangan dan dialog mereka secara bertahap meningkatkan ketegangan. Informasi apa yang paling penting dianalisis untuk memahami konflik adegan?',o:['Tujuan, posisi, respons, dan perubahan hubungan antartokoh','Jumlah kata dalam seluruh dialog saja','Panjang nama tokoh','Urutan alfabetis nama tokoh'],a:[0],e:'Konflik drama berkembang melalui tujuan dan respons tokoh serta perubahan hubungan mereka sepanjang adegan.',m:'Conflict Solver'},
{id:'BI12-GOLD-007',w:'🏛️ Nusantara Explorer',q:'Ketika menyusun feature tentang budaya daerah, bahan informasi sebaiknya dipilih berdasarkan hubungan dengan topik dan kemampuan bahan tersebut mendukung informasi utama. Prinsip tersebut paling dekat dengan...',o:['Seleksi informasi berdasarkan relevansi dan dukungan terhadap fokus feature','Pengumpulan semua informasi tanpa penyaringan','Pengutamaan informasi yang paling panjang','Penghapusan seluruh informasi lokal'],a:[0],e:'Feature membutuhkan bahan yang terpilih dan relevan agar fokus tulisan tetap jelas dan informasi yang disajikan saling mendukung.',m:'Source Sorting'},
{id:'BI12-GOLD-008',w:'🏛️ Nusantara Explorer',q:'Seorang pemain menemukan dua informasi tentang budaya lokal: satu berasal dari sumber yang dapat diverifikasi dan satu lagi hanya berupa klaim tanpa dukungan. Sebelum memasukkannya ke feature, keputusan terbaik adalah...',o:['Memprioritaskan informasi yang dapat diverifikasi dan mencari dukungan untuk klaim yang belum terbukti','Memilih klaim yang paling menarik tanpa pemeriksaan','Memasukkan keduanya sebagai fakta','Menghapus semua informasi budaya'],a:[0],e:'Feature berbasis informasi membutuhkan bahan yang dapat dipertanggungjawabkan. Klaim yang belum didukung perlu diverifikasi sebelum disajikan sebagai fakta.',m:'Fact Check'},
{id:'BI12-GOLD-009',w:'🌐 Career Mission',q:'Urutkan tindakan berikut ketika memeriksa dokumen lamaran agar hasilnya koheren: (A) mencocokkan kualifikasi dengan posisi, (B) memeriksa kelengkapan informasi, (C) memeriksa ketepatan bahasa dan penyajian.',o:['A → B → C','B → C → A','C → A → B','A → C → B'],a:[0],e:'Pemeriksaan dimulai dari kesesuaian isi dengan tujuan lamaran, dilanjutkan kelengkapan, kemudian ketepatan bahasa dan penyajian.',m:'Document Inspection'},
{id:'BI12-GOLD-010',w:'🎬 Film Detective',q:'Pilih tindakan yang membantu membandingkan cerpen dengan film ekranisasinya secara bermakna.',o:['Mencatat bagian cerita yang dipertahankan','Mencatat bagian yang diubah atau dihilangkan','Menganalisis dampak perubahan terhadap penyajian cerita','Menilai film hanya dari kualitas kamera'],a:[0,1,2],e:'Perbandingan ekranisasi perlu melihat unsur yang dipertahankan, diubah, atau dihilangkan serta dampaknya terhadap karya hasil adaptasi.',m:'Adaptation Compare'}
];
let i=0,xp=0,correct=0,answered=false,selected=[];
const $=id=>document.getElementById(id);function render(){answered=false;selected=[];const q=qs[i];$('world').textContent=q.w;$('counter').textContent=`Soal ${i+1} dari ${qs.length} · ${q.m}`;$('score').textContent=`XP ${xp}`;$('progress').style.width=((i)/qs.length*100)+'%';let html=`<div class="question">${q.q}</div><div class="options">`;q.o.forEach((t,j)=>html+=`<button class="option" data-j="${j}">${String.fromCharCode(65+j)}. ${t}</button>`);html+='</div><div class="actions"><button class="button" id="submit" disabled>Periksa Jawaban</button></div><div id="feedback" class="feedback hidden"></div>`;$('questionArea').innerHTML=html;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(+b.dataset.j,q));$('submit').onclick=()=>check(q)}
function choose(j,q){if(answered)return;const multi=q.id==='BI12-GOLD-010';if(multi){const p=selected.indexOf(j);p<0?selected.push(j):selected.splice(p,1)}else selected=[j];document.querySelectorAll('.option').forEach((b,k)=>b.classList.toggle('selected',selected.includes(k)));$('submit').disabled=!selected.length}
function check(q){if(answered)return;answered=true;const ok=selected.length===q.a.length&&selected.every(v=>q.a.includes(v));document.querySelectorAll('.option').forEach((b,k)=>{if(q.a.includes(k))b.classList.add('correct');else if(selected.includes(k))b.classList.add('wrong');b.disabled=true});if(ok){xp+=100;correct++}$('score').textContent=`XP ${xp}`;const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<strong>${ok?'✓ Jawaban benar!':'✗ Belum tepat.'}</strong><p>${q.e}</p><p class="small">Mekanik: ${q.m} · ID: ${q.id}</p><button class="button" id="next">${i===qs.length-1?'Lihat Hasil':'Soal Berikutnya'}</button>`;$('next').onclick=()=>{if(i===qs.length-1)finish();else{i++;render()}}}
function finish(){ $('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h1>🏆 Mission Complete</h1><p>Kamu menyelesaikan micro-prototype Bahasa Indonesia.</p><div class="stats"><div class="stat"><strong>${correct}/${qs.length}</strong><br><span class="small">Benar</span></div><div class="stat"><strong>${xp}</strong><br><span class="small">XP</span></div><div class="stat"><strong>${Math.round(correct/qs.length*100)}%</strong><br><span class="small">Akurasi</span></div></div><p>Prototype ini menguji alur soal → jawaban → feedback → XP → hasil. Konten produksi belum dianggap final sebelum provenance dan validasi guru selesai.</p><button class="button" onclick="location.reload()">Main Lagi</button>`}
render();
</script></body></html>
