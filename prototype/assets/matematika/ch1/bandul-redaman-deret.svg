<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Radial Gradients for Pendulum Bobs -->
    <radialGradient id="bob-main" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="bob-ghost-2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="bob-ghost-3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan-start" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M 5 1 L 1 3 L 5 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-cyan-end" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber-start" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M 5 1 L 1 3 L 5 5 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-amber-end" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-emerald-start" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M 5 1 L 1 3 L 5 5 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-emerald-end" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Card Frame / Grid -->
  <rect x="2" y="2" width="596" height="316" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title / Scenario Badge -->
  <g id="header-badge" transform="translate(20, 22)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
    <text x="24" y="16" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">MODEL AYUNAN TEREDAM</text>
  </g>

  <!-- Formula / Ratio Badge Top Right -->
  <g id="ratio-badge" transform="translate(420, 22)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="16" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Sensor Gerak Osilasi</text>
  </g>

  <!-- Ceiling Mount / Pivot Support -->
  <rect x="260" y="16" width="80" height="8" rx="2" fill="#334155"/>
  <polygon points="280,24 320,24 308,34 292,34" fill="#475569"/>
  <circle cx="300" cy="35" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Vertical Equilibrium Centerline -->
  <line x1="300" y1="35" x2="300" y2="248" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="300" y="260" fill="#64748b" font-size="10" text-anchor="middle">Garis Setimbang</text>

  <!-- ARC 1: 50 cm (Radius = 190, Angle = 35 deg) -->
  <!-- Left: (191, 186) to Right: (409, 186) -->
  <path d="M 191 186 A 190 190 0 0 0 409 186" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrow-cyan-start)" marker-end="url(#arrow-cyan-end)"/>

  <!-- ARC 2: 40 cm (Radius = 190, Angle = 28 deg) -->
  <!-- Left: (211, 198) to Right: (389, 198) -->
  <path d="M 211 198 A 190 190 0 0 0 389 198" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3" marker-start="url(#arrow-amber-start)" marker-end="url(#arrow-amber-end)"/>

  <!-- ARC 3: 32 cm (Radius = 190, Angle = 22 deg) -->
  <!-- Left: (229, 206) to Right: (371, 206) -->
  <path d="M 229 206 A 190 190 0 0 0 371 206" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2" marker-start="url(#arrow-emerald-start)" marker-end="url(#arrow-emerald-end)"/>

  <!-- Pendulum Strings from Pivot (300, 35) -->
  <!-- Position 1: Release at Left (191, 186) -->
  <line x1="300" y1="35" x2="191" y2="186" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.9"/>
  <!-- Position 2: Right swing peak 2 (389, 198) -->
  <line x1="300" y1="35" x2="389" y2="198" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <!-- Position 3: Left swing peak 3 (229, 206) -->
  <line x1="300" y1="35" x2="229" y2="206" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6"/>

  <!-- Pendulum Bobs -->
  <!-- Bob 1: Main Released Bob at (191, 186) -->
  <circle cx="191" cy="186" r="13" fill="url(#bob-main)" stroke="#e0f2fe" stroke-width="1.5"/>
  <text x="191" y="190" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">1</text>

  <!-- Bob 2: Ghost at (389, 198) -->
  <circle cx="389" cy="198" r="11" fill="url(#bob-ghost-2)" stroke="#fef3c7" stroke-width="1.2"/>
  <text x="389" y="202" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">2</text>

  <!-- Bob 3: Ghost at (229, 206) -->
  <circle cx="229" cy="206" r="9" fill="url(#bob-ghost-3)" stroke="#d1fae5" stroke-width="1"/>
  <text x="229" y="209" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">3</text>

  <!-- Arc Measurement Legend / Callout Badges -->
  <!-- Lintasan 1 Callout -->
  <g transform="translate(68, 140)">
    <rect x="0" y="0" width="112" height="28" rx="6" fill="#0c4a6e" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="56" y="14" fill="#bae6fd" font-size="10" font-weight="600" text-anchor="middle">Ayunan ke-1</text>
    <text x="56" y="24" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">50 cm</text>
  </g>

  <!-- Lintasan 2 Callout -->
  <g transform="translate(422, 145)">
    <rect x="0" y="0" width="112" height="28" rx="6" fill="#451a03" fill-opacity="0.85" stroke="#fbbf24" stroke-width="1"/>
    <text x="56" y="14" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">Ayunan ke-2</text>
    <text x="56" y="24" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">40 cm</text>
  </g>

  <!-- Lintasan 3 Callout -->
  <g transform="translate(85, 235)">
    <rect x="0" y="0" width="112" height="28" rx="6" fill="#064e3b" fill-opacity="0.85" stroke="#34d399" stroke-width="1"/>
    <text x="56" y="14" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">Ayunan ke-3</text>
    <text x="56" y="24" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">32 cm</text>
  </g>

  <!-- Bottom Progression Banner -->
  <g transform="translate(20, 280)">
    <rect x="0" y="0" width="560" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="280" y="18" fill="#94a3b8" font-size="11" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="bold">50 cm</tspan>, 
      <tspan fill="#fbbf24" font-weight="bold">40 cm</tspan>, 
      <tspan fill="#34d399" font-weight="bold">32 cm</tspan>, ... 
      <tspan fill="#64748b">(pola berlanjut hingga ayunan berhenti)</tspan>
    </text>
  </g>
</svg>
