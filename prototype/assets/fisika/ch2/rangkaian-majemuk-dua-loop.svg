<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow marker untuk arus dan loop -->
    <marker id="arrow-current" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-loop" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="28" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">RANGKAIAN LISTRIK MAJEMUK DUA LOOP (HUKUM KIRCHHOFF)</text>

  <!-- Simpul Atas A dan Simpul Bawah B -->
  <!-- Kawat Utama Persegi Luar & Cabang Tengah -->
  <!-- Kawat Loop 1 (Kiri): x=100 ke x=300, y=70 ke y=270 -->
  <!-- Kawat Loop 2 (Kanan): x=300 ke x=500, y=70 ke y=270 -->

  <!-- Kawat Horizontal Atas -->
  <line x1="100" y1="70" x2="500" y2="70" stroke="#38bdf8" stroke-width="2"/>
  <!-- Kawat Horizontal Bawah -->
  <line x1="100" y1="270" x2="500" y2="270" stroke="#38bdf8" stroke-width="2"/>

  <!-- Kawat Cabang Kiri: x=100 -->
  <line x1="100" y1="70" x2="100" y2="105" stroke="#38bdf8" stroke-width="2"/>
  <!-- Resistor R1 di Cabang Kiri (y=105..155) -->
  <path d="M 100 105 L 92 113 L 108 121 L 92 129 L 108 137 L 92 145 L 100 155" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="75" y="133" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="end">R₁ = 4 Ω</text>
  <line x1="100" y1="155" x2="100" y2="185" stroke="#38bdf8" stroke-width="2"/>

  <!-- Baterai E1 di Cabang Kiri (y=185..215) -->
  <!-- Terminal Positif (Garis Panjang) di y=190 -->
  <line x1="82" y1="190" x2="118" y2="190" stroke="#ef4444" stroke-width="3"/>
  <text x="70" y="194" fill="#ef4444" font-size="13" font-weight="bold">+</text>
  <!-- Terminal Negatif (Garis Pendek Tebal) di y=205 -->
  <line x1="90" y1="205" x2="110" y2="205" stroke="#60a5fa" stroke-width="4"/>
  <text x="72" y="209" fill="#60a5fa" font-size="15" font-weight="bold">-</text>
  <text x="75" y="228" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="end">ε₁ = 12 V</text>
  <line x1="100" y1="215" x2="100" y2="270" stroke="#38bdf8" stroke-width="2"/>

  <!-- Panah Arus I1 (ke atas) di Cabang Kiri -->
  <line x1="100" y1="95" x2="100" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-current)"/>
  <text x="115" y="90" fill="#38bdf8" font-size="12" font-weight="bold">I₁</text>

  <!-- Kawat Cabang Tengah: x=300 -->
  <line x1="300" y1="70" x2="300" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <!-- Resistor R2 di Cabang Tengah (y=135..185) -->
  <path d="M 300 135 L 292 143 L 308 151 L 292 159 L 308 167 L 292 175 L 300 185" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="325" y="163" fill="#34d399" font-size="12" font-weight="bold">R₂ = 2 Ω</text>
  <line x1="300" y1="185" x2="300" y2="270" stroke="#38bdf8" stroke-width="2"/>

  <!-- Panah Arus I3 (ke bawah) di Cabang Tengah -->
  <line x1="300" y1="90" x2="300" y2="115" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-current)"/>
  <text x="315" y="105" fill="#38bdf8" font-size="12" font-weight="bold">I₃</text>

  <!-- Kawat Cabang Kanan: x=500 -->
  <line x1="500" y1="70" x2="500" y2="105" stroke="#38bdf8" stroke-width="2"/>
  <!-- Resistor R3 di Cabang Kanan (y=105..155) -->
  <path d="M 500 105 L 492 113 L 508 121 L 492 129 L 508 137 L 492 145 L 500 155" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="525" y="133" fill="#fbbf24" font-size="12" font-weight="bold">R₃ = 4 Ω</text>
  <line x1="500" y1="155" x2="500" y2="185" stroke="#38bdf8" stroke-width="2"/>

  <!-- Baterai E2 di Cabang Kanan (y=185..215) -->
  <!-- Terminal Positif (Garis Panjang) di y=190 -->
  <line x1="482" y1="190" x2="518" y2="190" stroke="#ef4444" stroke-width="3"/>
  <text x="525" y="194" fill="#ef4444" font-size="13" font-weight="bold">+</text>
  <!-- Terminal Negatif (Garis Pendek Tebal) di y=205 -->
  <line x1="490" y1="205" x2="510" y2="205" stroke="#60a5fa" stroke-width="4"/>
  <text x="525" y="209" fill="#60a5fa" font-size="15" font-weight="bold">-</text>
  <text x="525" y="228" fill="#f8fafc" font-size="12" font-weight="bold">ε₂ = 6 V</text>
  <line x1="500" y1="215" x2="500" y2="270" stroke="#38bdf8" stroke-width="2"/>

  <!-- Panah Arus I2 (ke atas) di Cabang Kanan -->
  <line x1="500" y1="95" x2="500" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-current)"/>
  <text x="480" y="90" fill="#38bdf8" font-size="12" font-weight="bold">I₂</text>

  <!-- Titik Simpul A dan B -->
  <circle cx="300" cy="70" r="5" fill="#f8fafc"/>
  <text x="300" y="58" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Simpul A</text>

  <circle cx="300" cy="270" r="5" fill="#f8fafc"/>
  <text x="300" y="292" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Simpul B</text>

  <!-- Loop 1 (Kiri - Searah Jarum Jam) -->
  <path d="M 180 150 A 25 25 0 1 1 210 180" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-loop)"/>
  <text x="200" y="165" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">Loop 1</text>

  <!-- Loop 2 (Kanan - Berlawanan Jarum Jam) -->
  <path d="M 420 150 A 25 25 0 1 0 390 180" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-loop)"/>
  <text x="400" y="165" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">Loop 2</text>
</svg>

