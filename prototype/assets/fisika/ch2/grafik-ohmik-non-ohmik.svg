<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="300" y="28" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">KARAKTERISTIK GRAFIK I - V KONDUKTOR OHMIK DAN NON-OHMIK</text>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="80" y1="70" x2="520" y2="70"/>
    <line x1="80" y1="120" x2="520" y2="120"/>
    <line x1="80" y1="170" x2="520" y2="170"/>
    <line x1="80" y1="220" x2="520" y2="220"/>
    <line x1="80" y1="270" x2="520" y2="270"/>

    <line x1="168" y1="50" x2="168" y2="270"/>
    <line x1="256" y1="50" x2="256" y2="270"/>
    <line x1="344" y1="50" x2="344" y2="270"/>
    <line x1="432" y1="50" x2="432" y2="270"/>
    <line x1="520" y1="50" x2="520" y2="270"/>
  </g>

  <!-- Axis markers -->
  <defs>
    <marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Sumbu Utama (Origin di 80, 270) -->
  <line x1="80" y1="270" x2="540" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="80" y1="270" x2="80" y2="45" stroke="#94a3b8" stroke-width="2" marker-end="url(#axis-arrow)"/>

  <!-- Axis Labels -->
  <text x="545" y="275" fill="#94a3b8" font-size="13" font-weight="bold">V (Volt)</text>
  <text x="75" y="40" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="end">I (Ampere)</text>
  <text x="70" y="285" fill="#94a3b8" font-size="12">0</text>

  <!-- Kurva Komponen A: Garis Lurus Linear (Ohmik) -->
  <!-- Dari (80, 270) ke (500, 70) -->
  <line x1="80" y1="270" x2="500" y2="70" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="500" cy="70" r="5" fill="#38bdf8"/>
  <rect x="340" y="78" width="180" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="430" y="95" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Komponen A (Linier / Ohmik)</text>

  <!-- Kurva Komponen B: Melengkung landai ke kanan (Non-Ohmik Lampu Filamen) -->
  <!-- Dari (80, 270) kurva kuadratik/akar menuju (500, 150) -->
  <path d="M 80 270 Q 240 130 500 150" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="500" cy="150" r="5" fill="#fbbf24"/>
  <rect x="330" y="160" width="200" height="26" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="430" y="177" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Komponen B (Lampu Filamen Pijar)</text>

  <!-- Keterangan Analisis -->
  <text x="300" y="315" fill="#94a3b8" font-size="12" text-anchor="middle">Kemiringan kurva (ΔI/ΔV = 1/R). Pada Komponen B, kenaikan suhu menaikkan nilai hambatan R.</text>
</svg>

