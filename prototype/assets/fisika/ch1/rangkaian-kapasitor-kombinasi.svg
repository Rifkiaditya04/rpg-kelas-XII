<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Title / Label -->
  <text x="300" y="28" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">RANGKAIAN KOMBINASI KAPASITOR SERI - PARALEL</text>

  <!-- Garis Sirkuit Kawat Utama -->
  <!-- Dari Baterai Kiri (x=80) naik ke titik percabangan P (x=180) -->
  <path d="M 80 140 L 80 100 L 180 100" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 80 180 L 80 220 L 180 220" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Titik Cabang P (x=180, y=100) dan Titik Cabang Bawah (x=180, y=220) -->
  <circle cx="180" cy="100" r="4" fill="#38bdf8"/>
  <circle cx="180" cy="220" r="4" fill="#38bdf8"/>

  <!-- Cabang 1 (Atas): Terbagi ke dua kapasitor seri C1 dan C2 -->
  <line x1="180" y1="100" x2="180" y2="70" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="70" x2="250" y2="70" stroke="#38bdf8" stroke-width="2"/>

  <!-- Simbol Kapasitor C1 (x=250..270, y=70) -->
  <line x1="250" y1="50" x2="250" y2="90" stroke="#fbbf24" stroke-width="3"/>
  <line x1="262" y1="50" x2="262" y2="90" stroke="#fbbf24" stroke-width="3"/>
  <text x="256" y="42" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">C₁ = 6 μF</text>

  <!-- Kawat antara C1 dan C2 -->
  <line x1="262" y1="70" x2="350" y2="70" stroke="#38bdf8" stroke-width="2"/>

  <!-- Simbol Kapasitor C2 (x=350..370, y=70) -->
  <line x1="350" y1="50" x2="350" y2="90" stroke="#fbbf24" stroke-width="3"/>
  <line x1="362" y1="50" x2="362" y2="90" stroke="#fbbf24" stroke-width="3"/>
  <text x="356" y="42" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">C₂ = 3 μF</text>

  <!-- Kawat setelah C2 menuju titik kumpul Q (x=440) -->
  <line x1="362" y1="70" x2="440" y2="70" stroke="#38bdf8" stroke-width="2"/>
  <line x1="440" y1="70" x2="440" y2="100" stroke="#38bdf8" stroke-width="2"/>

  <!-- Cabang 2 (Tengah/Paralel): Kapasitor C3 (y=140) -->
  <line x1="180" y1="100" x2="180" y2="140" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="140" x2="295" y2="140" stroke="#38bdf8" stroke-width="2"/>

  <!-- Simbol Kapasitor C3 (x=295..315, y=140) -->
  <line x1="295" y1="120" x2="295" y2="160" stroke="#34d399" stroke-width="3"/>
  <line x1="307" y1="120" x2="307" y2="160" stroke="#34d399" stroke-width="3"/>
  <text x="301" y="112" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">C₃ = 4 μF</text>

  <line x1="307" y1="140" x2="440" y2="140" stroke="#38bdf8" stroke-width="2"/>
  <line x1="440" y1="140" x2="440" y2="100" stroke="#38bdf8" stroke-width="2"/>

  <!-- Titik Kumpul Q (x=440, y=100) dan Garis Kembali ke Baterai Bawah -->
  <circle cx="440" cy="100" r="4" fill="#38bdf8"/>
  <line x1="440" y1="100" x2="440" y2="220" stroke="#38bdf8" stroke-width="2"/>
  <line x1="440" y1="220" x2="180" y2="220" stroke="#38bdf8" stroke-width="2"/>

  <!-- Simbol Sumber Tegangan Baterai V = 12 V di Kiri (x=80, y=140..180) -->
  <!-- Garis Panjang (Positif) di y=150 -->
  <line x1="62" y1="150" x2="98" y2="150" stroke="#ef4444" stroke-width="3"/>
  <text x="50" y="154" fill="#ef4444" font-size="14" font-weight="bold">+</text>
  <!-- Garis Pendek Tebal (Negatif) di y=170 -->
  <line x1="70" y1="170" x2="90" y2="170" stroke="#60a5fa" stroke-width="4"/>
  <text x="52" y="174" fill="#60a5fa" font-size="16" font-weight="bold">-</text>
  <!-- Label Baterai -->
  <text x="120" y="165" fill="#f8fafc" font-size="14" font-weight="bold">V = 12 V</text>

  <!-- Keterangan Aliran Rangkaian -->
  <text x="300" y="260" fill="#94a3b8" font-size="12" text-anchor="middle">Cabang atas: C₁ dan C₂ tersusun SERI</text>
  <text x="300" y="280" fill="#94a3b8" font-size="12" text-anchor="middle">Cabang atas dan cabang C₃ tersusun PARALEL terhadap sumber tegangan 12 V</text>
</svg>

