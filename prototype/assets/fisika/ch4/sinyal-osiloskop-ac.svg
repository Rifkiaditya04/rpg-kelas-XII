<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-v" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">TAMPILAN SINYAL TEGANGAN SINUSOIDAL PADA LAYAR OSILOSKOP</text>

  <!-- Oscilloscope Bezel -->
  <rect x="50" y="40" width="380" height="250" rx="8" fill="#020617" stroke="#334155" stroke-width="3"/>

  <!-- Screen Graticule (10 cols x 8 rows, div size 35x28) -->
  <!-- Screen inner bounds: x=65 to 415, y=55 to 279 -->
  <g stroke="#1e293b" stroke-width="1">
    <!-- Vertical grid lines -->
    <line x1="65" y1="55" x2="65" y2="279"/>
    <line x1="100" y1="55" x2="100" y2="279"/>
    <line x1="135" y1="55" x2="135" y2="279"/>
    <line x1="170" y1="55" x2="170" y2="279"/>
    <line x1="205" y1="55" x2="205" y2="279"/>
    <line x1="240" y1="55" x2="240" y2="279" stroke="#334155" stroke-width="1.5"/><!-- Center X -->
    <line x1="275" y1="55" x2="275" y2="279"/>
    <line x1="310" y1="55" x2="310" y2="279"/>
    <line x1="345" y1="55" x2="345" y2="279"/>
    <line x1="380" y1="55" x2="380" y2="279"/>
    <line x1="415" y1="55" x2="415" y2="279"/>

    <!-- Horizontal grid lines -->
    <line x1="65" y1="55" x2="415" y2="55"/>
    <line x1="65" y1="83" x2="415" y2="83"/>
    <line x1="65" y1="111" x2="415" y2="111"/>
    <line x1="65" y1="139" x2="415" y2="139"/>
    <line x1="65" y1="167" x2="415" y2="167" stroke="#334155" stroke-width="1.5"/><!-- Center Y -->
    <line x1="65" y1="195" x2="415" y2="195"/>
    <line x1="65" y1="223" x2="415" y2="223"/>
    <line x1="65" y1="251" x2="415" y2="251"/>
    <line x1="65" y1="279" x2="415" y2="279"/>
  </g>

  <!-- Sine Wave Trace (Phosphor green):
       Center line is y = 167
       Amplitude = 2 div * 28 = 56 px (puncak y = 111, lembah y = 223) -> Vpp = 4 div = 112 px
       Period = 5 div * 35 = 175 px (2 cycles across 10 div = 350 px, from x=65 to 415)
  -->
  <path d="M 65 167
           C 108.75 92.3, 108.75 92.3, 152.5 167
           C 196.25 241.7, 196.25 241.7, 240 167
           C 283.75 92.3, 283.75 92.3, 327.5 167
           C 371.25 241.7, 371.25 241.7, 415 167"
        fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak-to-Peak Measurement Indicator (at x = 152.5) -->
  <line x1="108" y1="111" x2="108" y2="223" stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="95" y1="111" x2="120" y2="111" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="95" y1="223" x2="120" y2="223" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100" y="171" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="end">4 div (Vpp)</text>

  <!-- Period Measurement Indicator (from x=65 to 240) -->
  <line x1="65" y1="265" x2="240" y2="265" stroke="#fbbf24" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="65" y1="258" x2="65" y2="272" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="240" y1="258" x2="240" y2="272" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="152" y="260" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">1 Periode = 5 div (T)</text>

  <!-- Control Settings Panel (Right side) -->
  <rect x="445" y="45" width="135" height="240" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5"/>
  <text x="512" y="70" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PANEL KONTROL</text>

  <!-- CH1 Setting -->
  <rect x="455" y="85" width="115" height="48" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="465" y="103" fill="#94a3b8" font-size="10">VOLT / DIV (CH1)</text>
  <text x="465" y="123" fill="#38bdf8" font-size="15" font-weight="bold">5 V / div</text>

  <!-- TIME/DIV Setting -->
  <rect x="455" y="145" width="115" height="48" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="465" y="163" fill="#94a3b8" font-size="10">TIME / DIV</text>
  <text x="465" y="183" fill="#fbbf24" font-size="15" font-weight="bold">2 ms / div</text>

  <!-- Coupling -->
  <rect x="455" y="205" width="115" height="35" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="465" y="222" fill="#94a3b8" font-size="9">MODE KOPLING</text>
  <text x="465" y="235" fill="#22c55e" font-size="11" font-weight="bold">AC COUPLING</text>

  <!-- Bottom Caption -->
  <text x="300" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">Vpp = 4 div × 5 V/div = 20 V | Vmaks = 10 V | T = 5 div × 2 ms/div = 10 ms (f = 100 Hz)</text>
</svg>