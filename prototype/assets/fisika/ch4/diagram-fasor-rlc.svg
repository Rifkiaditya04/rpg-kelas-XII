<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow marker for axes -->
    <marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#64748b"/>
    </marker>
    <!-- Arrow marker for VR / I -->
    <marker id="arrow-vr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#fbbf24"/>
    </marker>
    <!-- Arrow marker for VL -->
    <marker id="arrow-vl" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ef4444"/>
    </marker>
    <!-- Arrow marker for VC -->
    <marker id="arrow-vc" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#a855f7"/>
    </marker>
    <!-- Arrow marker for Vtotal -->
    <marker id="arrow-vtotal" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">DIAGRAM FASOR TEGANGAN RANGKAIAN RLC (SIFAT KAPASITIF)</text>

  <!-- Cartesian Coordinate Origin at (190, 160) -->
  <!-- Horizontal Axis (X) -->
  <line x1="80" y1="160" x2="380" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#axis-arrow)"/>
  <text x="375" y="150" fill="#64748b" font-size="11">+X (Fase Arus I)</text>

  <!-- Vertical Axis (Y) -->
  <line x1="190" y1="280" x2="190" y2="50" stroke="#475569" stroke-width="1.5" marker-end="url(#axis-arrow)"/>
  <text x="198" y="58" fill="#64748b" font-size="11">+Y (Induktif)</text>
  <text x="198" y="275" fill="#64748b" font-size="11">-Y (Kapasitif)</text>

  <!-- Origin label -->
  <text x="180" y="155" fill="#94a3b8" font-size="11">O</text>

  <!-- Phasor VR (along +X: length 90 px = 30 V) -->
  <line x1="190" y1="160" x2="280" y2="160" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-vr)"/>
  <text x="245" y="148" fill="#fbbf24" font-size="12" font-weight="bold">VR = 30 V</text>

  <!-- Phasor VL (along +Y: length 60 px = 20 V) -->
  <line x1="190" y1="160" x2="190" y2="100" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-vl)"/>
  <text x="140" y="105" fill="#ef4444" font-size="11" font-weight="bold">VL = 20 V</text>

  <!-- Phasor VC (along -Y: length 180 px = 60 V) -->
  <line x1="190" y1="160" x2="190" y2="340" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow-vc)"/>
  <text x="140" y="260" fill="#a855f7" font-size="11" font-weight="bold">VC = 60 V</text>

  <!-- Net Reactive Voltage (VL - VC = -40 V, length 120 px downward) -->
  <line x1="184" y1="160" x2="184" y2="280" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="80" y="225" fill="#38bdf8" font-size="11" font-weight="bold">(VL - VC) = -40 V</text>

  <!-- Triangle Projection lines -->
  <line x1="280" y1="160" x2="280" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="190" y1="280" x2="280" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Resultant Voltage Phasor Vtotal (Origin to (280, 280), length = √(90² + 120²) = 150 px = 50 V) -->
  <line x1="190" y1="160" x2="280" y2="280" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow-vtotal)"/>
  <text x="250" y="240" fill="#38bdf8" font-size="13" font-weight="bold">Vtotal = 50 V</text>

  <!-- Phase Angle Arc (-phi = -53 deg) -->
  <path d="M 225 160 A 35 35 0 0 1 211 188" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="230" y="180" fill="#f43f5e" font-size="12" font-weight="bold">φ = -53°</text>

  <!-- Info Panel (Right side: x=395 to 575) -->
  <rect x="395" y="45" width="185" height="255" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5"/>
  <text x="487" y="70" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">ANALISIS SIFAT RANGKAIAN</text>

  <text x="410" y="98" fill="#fbbf24" font-size="11">VR = 30 V (Sefase arus I)</text>
  <text x="410" y="120" fill="#ef4444" font-size="11">VL = 20 V (Mendahului I 90°)</text>
  <text x="410" y="142" fill="#a855f7" font-size="11">VC = 60 V (Tertinggal I 90°)</text>

  <line x1="410" y1="155" x2="565" y2="155" stroke="#475569" stroke-width="1"/>

  <text x="410" y="175" fill="#38bdf8" font-size="11" font-weight="bold">Reaktif Netto: -40 V</text>
  <text x="410" y="195" fill="#f8fafc" font-size="11">V = √( 30² + (-40)² ) = 50 V</text>
  <text x="410" y="215" fill="#f43f5e" font-size="11">tan φ = -40/30 = -4/3</text>
  <text x="410" y="235" fill="#f43f5e" font-size="11" font-weight="bold">Sifat: KAPASITIF (φ &lt; 0)</text>
  <text x="410" y="255" fill="#22c55e" font-size="10">Arus mendahului tegangan</text>
  <text x="410" y="270" fill="#22c55e" font-size="10">sebesar 53° (atau 0,93 rad)</text>
  <text x="410" y="288" fill="#38bdf8" font-size="10">V(t) = 50√2 sin(ωt - 53°) V</text>
</svg>