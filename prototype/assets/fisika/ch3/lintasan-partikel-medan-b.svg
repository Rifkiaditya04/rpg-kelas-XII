<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow-v" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="26" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">SPEKTROMETER MASSA: LINTASAN ION BERMUATAN DALAM MEDAN MAGNET</text>

  <!-- Region of Magnetic Field B (Inward) -->
  <rect x="120" y="45" width="440" height="205" rx="8" fill="#1e293b" fill-opacity="0.35" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="545" y="70" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="end">Medan B homogen (masuk bidang ⊗)</text>

  <!-- Cross markers representing B field into page -->
  <g fill="#475569" font-size="14" text-anchor="middle" font-family="monospace">
    <text x="160" y="80">⊗</text><text x="230" y="80">⊗</text><text x="300" y="80">⊗</text><text x="370" y="80">⊗</text><text x="440" y="80">⊗</text><text x="510" y="80">⊗</text>
    <text x="160" y="125">⊗</text><text x="230" y="125">⊗</text><text x="300" y="125">⊗</text><text x="370" y="125">⊗</text><text x="440" y="125">⊗</text><text x="510" y="125">⊗</text>
    <text x="160" y="170">⊗</text><text x="230" y="170">⊗</text><text x="300" y="170">⊗</text><text x="370" y="170">⊗</text><text x="440" y="170">⊗</text><text x="510" y="170">⊗</text>
    <text x="160" y="215">⊗</text><text x="230" y="215">⊗</text><text x="300" y="215">⊗</text><text x="370" y="215">⊗</text><text x="440" y="215">⊗</text><text x="510" y="215">⊗</text>
  </g>

  <!-- Detector Plate Baseline -->
  <line x1="140" y1="250" x2="400" y2="250" stroke="#f43f5e" stroke-width="3"/>
  <text x="270" y="275" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">Pelat Film / Detektor Ion</text>

  <!-- Slit (Celah Masuk) at x=410, y=250 -->
  <rect x="406" y="250" width="8" height="6" fill="#fbbf24"/>
  <line x1="410" y1="295" x2="410" y2="255" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-v)"/>
  <text x="410" y="310" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Berkas Ion (+q, v)</text>

  <!-- Trajectory 1: Ion 1 (m1, r1 = 60 px) -->
  <!-- Semicircle from (410, 250) to (290, 250), center at (350, 250), radius 60 -->
  <path d="M 410 250 A 60 60 0 0 0 290 250" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="290" cy="250" r="4" fill="#22c55e"/>
  <text x="290" y="240" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">Titik 1 (m₁)</text>
  <!-- Diameter 1 dimension -->
  <line x1="290" y1="262" x2="410" y2="262" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="350" y="260" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle">2r₁</text>

  <!-- Trajectory 2: Ion 2 (m2 = 2m1, r2 = 60 * sqrt(2) ≈ 85 px) -->
  <!-- Semicircle from (410, 250) to (240, 250), center at (325, 250), radius 85 -->
  <path d="M 410 250 A 85 85 0 0 0 240 250" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="240" cy="250" r="4" fill="#a855f7"/>
  <text x="235" y="240" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">Titik 2 (m₂)</text>
  <!-- Diameter 2 dimension -->
  <line x1="240" y1="285" x2="410" y2="285" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="325" y="297" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">2r₂ = 2√2 r₁</text>

  <!-- Legend Box -->
  <rect x="25" y="60" width="85" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="67" y="78" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">Keterangan</text>
  <line x1="32" y1="95" x2="52" y2="95" stroke="#22c55e" stroke-width="2"/>
  <text x="58" y="98" fill="#22c55e" font-size="10">Ion 1 (m₁)</text>
  <line x1="32" y1="120" x2="52" y2="120" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="58" y="123" fill="#a855f7" font-size="10">Ion 2 (m₂)</text>
  <circle cx="42" cy="148" r="3" fill="#fbbf24"/>
  <text x="58" y="151" fill="#fbbf24" font-size="10">Celah</text>
</svg>
