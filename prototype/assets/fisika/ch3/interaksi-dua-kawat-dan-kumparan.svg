<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker Current Up -->
    <marker id="arrow-i1" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
    <!-- Arrow Marker Current Down -->
    <marker id="arrow-i2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#fbbf24"/>
    </marker>
    <!-- Arrow Marker Force Repulsion Left -->
    <marker id="arrow-f-left" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ef4444"/>
    </marker>
    <!-- Arrow Marker Force Repulsion Right -->
    <marker id="arrow-f-right" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ef4444"/>
    </marker>
    <!-- Arrow Marker Distance Dim -->
    <marker id="arrow-dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="28" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">INTERAKSI GAYA MAGNETIK DUA KAWAT LURUS SEJAJAR BERARUS</text>

  <!-- Wire 1 (Left, x = 200) -->
  <line x1="200" y1="45" x2="200" y2="275" stroke="#38bdf8" stroke-width="4"/>
  <line x1="200" y1="200" x2="200" y2="120" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-i1)"/>
  <text x="185" y="100" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">Kawat 1</text>
  <text x="185" y="120" fill="#38bdf8" font-size="12" text-anchor="end">I₁ = 6 A (ke atas)</text>

  <!-- Wire 2 (Right, x = 400) -->
  <line x1="400" y1="45" x2="400" y2="275" stroke="#fbbf24" stroke-width="4"/>
  <line x1="400" y1="120" x2="400" y2="200" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-i2)"/>
  <text x="415" y="215" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="start">Kawat 2</text>
  <text x="415" y="235" fill="#fbbf24" font-size="12" text-anchor="start">I₂ = 10 A (ke bawah)</text>

  <!-- Distance a = 10 cm between Wires -->
  <line x1="200" y1="65" x2="400" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="200" cy="65" r="3" fill="#94a3b8"/>
  <circle cx="400" cy="65" r="3" fill="#94a3b8"/>
  <text x="300" y="58" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">Jarak pisah a = 10 cm</text>

  <!-- Force Vector F on Wire 1 (Repulsion to the left) -->
  <line x1="200" y1="160" x2="110" y2="160" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-f-left)"/>
  <text x="150" y="150" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">F₂₁ (ke kiri)</text>

  <!-- Force Vector F on Wire 2 (Repulsion to the right) -->
  <line x1="400" y1="160" x2="490" y2="160" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-f-right)"/>
  <text x="450" y="150" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">F₁₂ (ke kanan)</text>

  <!-- Repulsion Indicator Arc / Label in Center -->
  <rect x="235" y="135" width="130" height="50" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2"/>
  <text x="300" y="155" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">Gaya Interaksi</text>
  <text x="300" y="173" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">TOLAK-MENOLAK</text>

  <!-- Medium Permeability Note -->
  <text x="300" y="295" fill="#64748b" font-size="11" text-anchor="middle">Medium: Udara (μ₀ = 4π × 10⁻⁷ T·m/A)</text>
</svg>

