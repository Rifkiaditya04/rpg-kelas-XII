<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Velocity -->
    <marker id="arrow-v" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8"/>
    </marker>
    <!-- Arrow Current -->
    <marker id="arrow-i" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#22c55e"/>
    </marker>
    <!-- Arrow Force Lawan -->
    <marker id="arrow-f-opp" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ef4444"/>
    </marker>
    <!-- Arrow Force Luar -->
    <marker id="arrow-f-ext" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="26" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">GGL INDUKSI GERAK (MOTIONAL EMF) BATANG KONDUKTOR PADA REL U</text>

  <!-- Magnetic Field Inward Region -->
  <rect x="70" y="45" width="480" height="235" rx="8" fill="#1e293b" fill-opacity="0.35" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="535" y="70" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="end">Medan B = 0,5 T (masuk bidang ⊗)</text>

  <!-- Cross markers representing B field into page -->
  <g fill="#475569" font-size="14" text-anchor="middle" font-family="monospace">
    <text x="110" y="80">⊗</text><text x="190" y="80">⊗</text><text x="270" y="80">⊗</text><text x="350" y="80">⊗</text><text x="430" y="80">⊗</text><text x="510" y="80">⊗</text>
    <text x="110" y="130">⊗</text><text x="190" y="130">⊗</text><text x="270" y="130">⊗</text><text x="350" y="130">⊗</text><text x="430" y="130">⊗</text><text x="510" y="130">⊗</text>
    <text x="110" y="180">⊗</text><text x="190" y="180">⊗</text><text x="270" y="180">⊗</text><text x="350" y="180">⊗</text><text x="430" y="180">⊗</text><text x="510" y="180">⊗</text>
    <text x="110" y="230">⊗</text><text x="190" y="230">⊗</text><text x="270" y="230">⊗</text><text x="350" y="230">⊗</text><text x="430" y="230">⊗</text><text x="510" y="230">⊗</text>
    <text x="110" y="270">⊗</text><text x="190" y="270">⊗</text><text x="270" y="270">⊗</text><text x="350" y="270">⊗</text><text x="430" y="270">⊗</text><text x="510" y="270">⊗</text>
  </g>

  <!-- U-shaped Rail -->
  <!-- Upper Rail -->
  <line x1="120" y1="100" x2="480" y2="100" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Lower Rail -->
  <line x1="120" y1="220" x2="480" y2="220" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Left Connection with Resistor R -->
  <line x1="120" y1="100" x2="120" y2="135" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="120" y1="185" x2="120" y2="220" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Resistor Box on Left -->
  <rect x="105" y="135" width="30" height="50" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="95" y="163" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="end">R = 2 Ω</text>
  <!-- Current Arrow on Resistor (Downward) -->
  <line x1="120" y1="145" x2="120" y2="175" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-i)"/>
  <text x="140" y="164" fill="#22c55e" font-size="11" font-weight="bold">I</text>

  <!-- Distance between rails (Length l = 40 cm) -->
  <line x1="495" y1="100" x2="495" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="505" y="165" fill="#94a3b8" font-size="12" font-weight="bold">l = 40 cm</text>

  <!-- Sliding Conducting Rod PQ at x = 330 -->
  <line x1="330" y1="88" x2="330" y2="232" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <!-- End Points P (Top) and Q (Bottom) -->
  <circle cx="330" cy="100" r="5" fill="#ef4444"/>
  <text x="330" y="80" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">P (+)</text>
  <circle cx="330" cy="220" r="5" fill="#3b82f6"/>
  <text x="330" y="248" fill="#3b82f6" font-size="13" font-weight="bold" text-anchor="middle">Q (-)</text>

  <!-- Current Arrow inside rod (Upward from Q to P) -->
  <line x1="330" y1="180" x2="330" y2="140" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-i)"/>
  <text x="345" y="164" fill="#22c55e" font-size="12" font-weight="bold">I = 0,5 A</text>

  <!-- Velocity Vector v (To the Right) -->
  <line x1="350" y1="120" x2="430" y2="120" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-v)"/>
  <text x="390" y="112" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">v = 5 m/s</text>

  <!-- Opposing Lorentz Force Flawan (To the Left) -->
  <line x1="310" y1="160" x2="230" y2="160" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-f-opp)"/>
  <text x="270" y="152" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">Flawan = 0,1 N</text>

  <!-- External Pulling Force Fluar (To the Right) -->
  <line x1="350" y1="200" x2="430" y2="200" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow-f-ext)"/>
  <text x="390" y="192" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">Fluar = 0,1 N</text>

  <!-- Explanatory Bottom Legend -->
  <text x="300" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">Rangkaian tertutup: ε = Blv = 1,0 V | Arus pada batang Q → P | Daya P = 0,5 W</text>
</svg>

